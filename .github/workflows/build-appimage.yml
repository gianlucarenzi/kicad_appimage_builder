name: Build KiCad AppImage

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  # Silenzia l'hint di git sul nome del branch iniziale durante il checkout
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  build:
    runs-on: ubuntu-24.04  # Versione fissata: ubuntu-latest migra a Ubuntu 26 dal 19/10/2026
    permissions:
      contents: write  # Necessario per creare release e caricare assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Free up disk space
        run: |
          # Rimuovi software non necessario per liberare spazio
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Determine release version
        run: |
          # Tag v2.0.1 -> 2.0.1; build non da tag -> dev-<sha>
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "APPIMAGE=KiCad-5.1.12-$RELEASE_VERSION-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Build KiCad AppImage
        run: |
          chmod +x build_kicad_appimage.sh
          ./build_kicad_appimage.sh

      - name: Verify AppImage
        run: |
          ls -lh output/
          file "output/$APPIMAGE"
          chmod +x "output/$APPIMAGE"
          "output/$APPIMAGE" --appimage-version || true

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v7
        with:
          name: KiCad-5.1.12-${{ env.RELEASE_VERSION }}-AppImage
          path: output/${{ env.APPIMAGE }}
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: output/${{ env.APPIMAGE }}
          draft: false
          prerelease: false
          body: |
            # KiCad 5.1.12 AppImage

            AppImage di KiCad 5.1.12 basato su Ubuntu 20.04.

            ## Download

            Scarica `${{ env.APPIMAGE }}` e rendilo eseguibile:

            ```bash
            chmod +x ${{ env.APPIMAGE }}
            ./${{ env.APPIMAGE }}
            ```

            ## Compatibilità

            - ✅ Debian 12 (Bookworm)
            - ✅ Ubuntu 20.04+
            - ✅ Altre distribuzioni Linux moderne con GLIBC 2.31+

            ## Note

            - Include Python 3.8 per il supporto agli script
            - Include tutte le librerie KiCad (simboli, footprint, modelli 3D)
            - Compatibile con sistemi moderni grazie alla gestione dinamica dei loader gdk-pixbuf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
